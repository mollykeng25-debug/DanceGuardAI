<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | DanceGuard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <style>
    :root { --ink: #10232a; --muted: #5d7173; --teal: #0e8f88; --gold: #e5a84b; --cream: #fffaf0; --line: #dce7df; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", sans-serif; background: radial-gradient(circle at 12% 18%, #d8f1e6 0 14%, transparent 38%), radial-gradient(circle at 90% 86%, #ffe4b7 0 10%, transparent 33%), linear-gradient(135deg, #f7fbf4, #eef6ed); display: grid; place-items: center; padding: 24px; }
    .shell { width: min(980px, 100%); min-height: 620px; display: grid; grid-template-columns: 0.9fr 1.1fr; overflow: hidden; border: 1px solid rgba(16, 35, 42, .12); border-radius: 24px; background: rgba(255, 255, 255, .86); box-shadow: 0 28px 70px rgba(38, 74, 62, .18); }
    .welcome { padding: clamp(32px, 6vw, 76px); color: #f8fff9; background: linear-gradient(155deg, #0d7975, #124e54 68%, #173941); display: flex; flex-direction: column; justify-content: space-between; }
    .brand { font-size: 1.35rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .welcome h1 { max-width: 330px; margin: 80px 0 18px; font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: .98; letter-spacing: -.05em; }
    .welcome p { max-width: 310px; margin: 0; color: #d8f4e8; line-height: 1.7; }
    .mark { align-self: flex-end; color: var(--gold); font-size: 4rem; line-height: 1; }
    .panel { padding: clamp(32px, 6vw, 76px); display: flex; flex-direction: column; justify-content: center; }
    .panel h2 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -.04em; }
    .subtitle { margin: 0 0 30px; color: var(--muted); }
    form { display: grid; gap: 14px; }
    label { color: var(--muted); font-size: .82rem; font-weight: 700; }
    input { width: 100%; margin-top: 7px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--cream); color: var(--ink); outline: none; }
    input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(14, 143, 136, .14); }
    button { border: 0; border-radius: 10px; padding: 14px 16px; font: inherit; font-weight: 800; cursor: pointer; }
    .primary { margin-top: 6px; color: white; background: var(--teal); }
    .google { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ink); background: white; border: 1px solid var(--line); }
    .google strong { color: #4285f4; font-size: 1.2rem; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 23px 0; color: #96a7a3; font-size: .78rem; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .switch { margin: 22px 0 0; text-align: center; color: var(--muted); font-size: .9rem; }
    .switch button { padding: 0; color: var(--teal); background: transparent; }
    #message { min-height: 24px; margin: 16px 0 0; color: #b34d39; font-size: .9rem; text-align: center; }
    @media (max-width: 720px) { body { padding: 0; } .shell { min-height: 100vh; grid-template-columns: 1fr; border: 0; border-radius: 0; } .welcome { min-height: 245px; padding: 28px; } .welcome h1 { margin: 42px 0 10px; font-size: 2.6rem; } .welcome p { font-size: .9rem; } .mark { display: none; } .panel { padding: 38px 28px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="welcome" aria-label="DanceGuard welcome">
      <div class="brand">DanceGuard</div>
      <div><h1>Move well.<br>Recover smarter.</h1><p>Your personal space for safer practice, thoughtful recovery, and steady progress.</p></div>
      <div class="mark" aria-hidden="true">✦</div>
    </section>
    <section class="panel">
      <h2 id="form-title">Welcome back</h2>
      <p class="subtitle" id="form-subtitle">Sign in to continue your practice.</p>
      <button class="google" id="google-button" type="button"><strong>G</strong> Continue with Google</button>
      <div class="divider">or use your email</div>
      <form id="auth-form">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="primary" id="submit-button" type="submit">Sign in</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="switch"><span id="switch-copy">New to DanceGuard?</span> <button id="mode-button" type="button">Create an account</button></p>
    </section>
  </main>
  <script>
    window.addEventListener('load', async () => {
      const { createClient } = window.supabase;
      const supabase = createClient({{ supabase_url|tojson }}, {{ supabase_anon_key|tojson }});
      const form = document.getElementById('auth-form');
      const message = document.getElementById('message');
      let signUpMode = false;
      const setMessage = (text, error = true) => { message.textContent = text; message.style.color = error ? '#b34d39' : '#0e8f88'; };
      const redirectIfSignedIn = async () => { const { data } = await supabase.auth.getSession(); if (data.session) window.location.href = '/app'; };
      await redirectIfSignedIn();
      document.getElementById('google-button').addEventListener('click', async () => {
        setMessage('Redirecting to Google...', false);
        const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/login' } });
        if (error) setMessage(error.message);
      });
      document.getElementById('mode-button').addEventListener('click', () => {
        signUpMode = !signUpMode;
        document.getElementById('form-title').textContent = signUpMode ? 'Create your account' : 'Welcome back';
        document.getElementById('form-subtitle').textContent = signUpMode ? 'Start building a safer practice.' : 'Sign in to continue your practice.';
        document.getElementById('submit-button').textContent = signUpMode ? 'Sign up' : 'Sign in';
        document.getElementById('switch-copy').textContent = signUpMode ? 'Already have an account?' : 'New to DanceGuard?';
        document.getElementById('mode-button').textContent = signUpMode ? 'Sign in' : 'Create an account';
        document.getElementById('password').autocomplete = signUpMode ? 'new-password' : 'current-password';
        setMessage('');
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const result = signUpMode ? await supabase.auth.signUp({ email, password }) : await supabase.auth.signInWithPassword({ email, password });
        if (result.error) return setMessage(result.error.message);
        if (signUpMode && !result.data.session) return setMessage('Check your email to confirm your account.', false);
        window.location.href = '/app';
      });
    });
  </script>
</body>
</html>
