<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanceGuard - Settings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
  <script src="{{ url_for('static', filename='sidebar.js') }}" defer></script>
  <style>
    :root {
      --bg: #091722;
      --panel: #162a38;
      --line: #3a5870;
      --text: #edf6ff;
      --text-muted: #a9bfd3;
      --teal: #2ec7d7;
      --teal-glow: #7fe8f1;
      --yellow: #f5be5b;
      --coral: #ef6c62;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding: 6rem 1.25rem 2rem;
      color: var(--text);
      background: radial-gradient(circle at 18% 20%, rgba(126,232,241,0.12), transparent 20rem), linear-gradient(160deg, #091722 0%, #0d1d2a 32%, #07131d 100%);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      line-height: 1.5;
    }

    .settings-shell {
      width: min(100%, 900px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .settings-card {
      background: linear-gradient(180deg, rgba(33, 52, 65, 0.98), rgba(11, 21, 30, 0.96));
      border: 1px solid rgba(95, 128, 144, 0.8);
      border-radius: 22px;
      padding: clamp(1.25rem, 3vw, 2rem);
      box-shadow: 0 22px 46px rgba(0, 0, 0, 0.42), inset 1px 1px 0 rgba(255,255,255,0.08), inset -2px -2px 5px rgba(0,0,0,0.28);
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      background: linear-gradient(135deg, var(--teal-glow), var(--yellow) 78%, #f4a261);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--text-muted);
      margin-top: 0.25rem;
      font-size: 0.92rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .calendar-shell {
      margin-top: 1rem;
      background: rgba(10, 18, 25, 0.72);
      border: 1px solid rgba(95, 128, 144, 0.8);
      border-radius: 14px;
      overflow: hidden;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid rgba(95, 128, 144, 0.7);
      background: rgba(15, 28, 37, 0.9);
    }

    .calendar-title {
      font-weight: 800;
      color: var(--text);
    }

    .calendar-nav {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .nav-button {
      border: 1px solid rgba(120, 151, 170, 0.8);
      background: linear-gradient(180deg, #243d4f, #162b38);
      color: var(--text);
      border-radius: 8px;
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      font-weight: 800;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.35rem;
      padding: 0.85rem;
    }

    .day-label {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 0.3rem;
    }

    .day-cell {
      min-height: 82px;
      border-radius: 10px;
      border: 1px solid rgba(95, 128, 144, 0.6);
      background: rgba(17, 28, 36, 0.82);
      padding: 0.45rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .day-cell.empty {
      background: rgba(12, 18, 24, 0.5);
      border-style: dashed;
    }

    .day-number {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .day-hours {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--teal-glow);
    }

    .day-cell.has-hours {
      border-color: rgba(126, 232, 241, 0.7);
      background: rgba(17, 42, 48, 0.9);
    }

    .month-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .summary-box {
      background: rgba(13, 25, 35, 0.9);
      border: 1px solid rgba(95, 128, 144, 0.8);
      border-radius: 12px;
      padding: 0.8rem;
    }

    .summary-box .small {
      display: block;
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.3rem;
    }

    .summary-box strong {
      font-size: 1.4rem;
      color: var(--yellow);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.8rem 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(95, 128, 144, 0.8);
      background: linear-gradient(180deg, #0d1925, #101f2d);
      color: var(--text);
      box-shadow: inset 3px 3px 7px rgba(0,0,0,0.26), inset -2px -2px 5px rgba(255,255,255,0.04);
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.45rem;
      margin-top: 0.35rem;
    }

    .day-checkbox { display: none; }

    .day-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2.8rem;
      background: linear-gradient(180deg, #243d4f, #162b38);
      border: 1px solid rgba(120, 151, 170, 0.8);
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
      box-shadow: 0 6px 0 rgba(4, 11, 18, 0.55), inset 1px 1px 0 rgba(255,255,255,0.14), inset -2px -2px 3px rgba(0,0,0,0.38);
    }

    .day-checkbox:checked + .day-label {
      background: linear-gradient(180deg, #2ec7d7, #1a9db1);
      color: #ecfeff;
      border-color: rgba(126, 232, 241, 0.45);
    }

    .profile-toolbar {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(120, 151, 170, 0.8);
      background: linear-gradient(180deg, #2ec7d7, #1a9db1);
      color: #ecfeff;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 6px 0 rgba(4, 11, 18, 0.55), inset 1px 1px 0 rgba(255,255,255,0.14), inset -2px -2px 3px rgba(0,0,0,0.38);
      transition: transform 0.16s ease, filter 0.16s ease;
      text-decoration: none;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .btn:active { transform: translateY(2px); box-shadow: inset 3px 3px 6px rgba(0,0,0,0.34), inset -1px -1px 2px rgba(255,255,255,0.08); }
    .btn-secondary { background: linear-gradient(180deg, #243d4f, #162b38); }
    .btn-danger { background: linear-gradient(180deg, #ef6c62, #c74a44); border-color: rgba(255, 175, 170, 0.48); }

    .status-message {
      min-height: 1.1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .avatar-preview {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(126, 232, 241, 0.6);
      background: linear-gradient(180deg, #243d4f, #162b38);
      display: grid;
      place-items: center;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.14), inset -2px -2px 3px rgba(0,0,0,0.38);
      font-weight: 800;
      font-size: 2rem;
      color: #ecfeff;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    @media (max-width: 720px) {
      .settings-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      body { padding-top: 5rem; }
    }
  </style>
</head>
<body>
  <main class="settings-shell">
    <section class="settings-card">
      <div class="page-header">
        <div>
          <h1>Settings</h1>
          <p class="subtitle">Manage your profile and onboarding information</p>
        </div>
      </div>

      <form id="settings-form">
        <div class="settings-grid">
          <div class="field full">
            <label>Profile photo</label>
            <div class="avatar-row">
              <div class="avatar-preview" id="avatar-preview">
                {% if profile.avatar %}<img src="{{ profile.avatar }}" alt="Profile photo">{% else %}{{ (profile.name or 'D')[:1]|upper }}{% endif %}
              </div>
              <div class="profile-toolbar">
                <label class="btn btn-secondary" for="avatar-upload">Upload image</label>
                <button type="button" class="btn btn-secondary" id="take-photo">Take photo</button>
                <button type="button" class="btn btn-danger" id="remove-photo">Remove</button>
                <input type="file" id="avatar-upload" accept="image/*" hidden>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="name">Dancer name</label>
            <input id="name" name="name" type="text" value="{{ profile.name or '' }}" placeholder="e.g. Alex">
          </div>

          <div class="field">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="5" max="100" value="{{ profile.age or '' }}" placeholder="e.g. 17">
          </div>

          <div class="field">
            <label for="hours_per_week">Hours danced per week</label>
            <input id="hours_per_week" name="hours_per_week" type="number" min="1" max="60" value="{{ profile.hours_per_week or '' }}" placeholder="e.g. 10">
          </div>

          <div class="field">
            <label for="style">Primary dance style</label>
            <select id="style" name="style">
              <option value="hip-hop" {% if (profile.style or '') == 'hip-hop' %}selected{% endif %}>Hip-Hop / Breaking</option>
              <option value="ballet" {% if (profile.style or '') == 'ballet' %}selected{% endif %}>Ballet / Contemporary</option>
              <option value="jazz" {% if (profile.style or '') == 'jazz' %}selected{% endif %}>Jazz / Theater</option>
            </select>
          </div>

          <div class="field full">
            <label>Which days do you dance?</label>
            <div class="days-grid">
              {% set selected_days = profile.dance_days or [] %}
              <input type="checkbox" id="day-sun" value="Sunday" class="day-checkbox" {% if 'Sunday' in selected_days %}checked{% endif %}><label for="day-sun" class="day-label">Sun</label>
              <input type="checkbox" id="day-mon" value="Monday" class="day-checkbox" {% if 'Monday' in selected_days %}checked{% endif %}><label for="day-mon" class="day-label">Mon</label>
              <input type="checkbox" id="day-tue" value="Tuesday" class="day-checkbox" {% if 'Tuesday' in selected_days %}checked{% endif %}><label for="day-tue" class="day-label">Tue</label>
              <input type="checkbox" id="day-wed" value="Wednesday" class="day-checkbox" {% if 'Wednesday' in selected_days %}checked{% endif %}><label for="day-wed" class="day-label">Wed</label>
              <input type="checkbox" id="day-thu" value="Thursday" class="day-checkbox" {% if 'Thursday' in selected_days %}checked{% endif %}><label for="day-thu" class="day-label">Thu</label>
              <input type="checkbox" id="day-fri" value="Friday" class="day-checkbox" {% if 'Friday' in selected_days %}checked{% endif %}><label for="day-fri" class="day-label">Fri</label>
              <input type="checkbox" id="day-sat" value="Saturday" class="day-checkbox" {% if 'Saturday' in selected_days %}checked{% endif %}><label for="day-sat" class="day-label">Sat</label>
            </div>
          </div>

          <div class="field full">
            <label for="injuries">Previous injuries / sensitive areas</label>
            <textarea id="injuries" name="injuries" placeholder="e.g. Right ankle sprain, lower back strain">{{ profile.injuries or '' }}</textarea>
          </div>
        </div>

        <div class="profile-toolbar">
          <button type="submit" class="btn">Save settings</button>
          <a href="/profile" class="btn btn-secondary">View profile</a>
          <a href="/dance" class="btn btn-secondary">Open studio</a>
          <button type="button" class="btn btn-danger" id="sign-out-button" data-supabase-url="{{ supabase_url }}" data-supabase-anon-key="{{ supabase_anon_key }}">Sign out</button>
          <div id="settings-status" class="status-message" aria-live="polite"></div>
        </div>
      </form>
    </section>

    <section class="settings-card">
      <h2 style="margin-bottom:0.75rem; color:var(--teal-glow);">Dance hour history</h2>
      <div class="calendar-shell">
        <div class="calendar-header">
          <div class="calendar-title" id="calendar-title">Month</div>
          <div class="calendar-nav">
            <button class="nav-button" id="prev-month" type="button">←</button>
            <button class="nav-button" id="next-month" type="button">→</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
      <div class="month-summary">
        <div class="summary-box">
          <span class="small">This month</span>
          <strong id="month-total-hours">0.0h</strong>
        </div>
        <div class="summary-box">
          <span class="small">Dance days</span>
          <strong id="month-day-count">0</strong>
        </div>
        <div class="summary-box">
          <span class="small">Average</span>
          <strong id="month-average-hours">0.0h</strong>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('settings-form');
    const statusEl = document.getElementById('settings-status');
    const signOutButton = document.getElementById('sign-out-button');

    signOutButton.addEventListener('click', async () => {
      signOutButton.disabled = true;
      signOutButton.textContent = 'Signing out...';
      try {
        const supabase = window.supabase.createClient(signOutButton.dataset.supabaseUrl, signOutButton.dataset.supabaseAnonKey);
        const { error } = await supabase.auth.signOut();
        if (error) throw error;
      } catch (error) {
        statusEl.textContent = 'Unable to sign out. Please try again.';
        signOutButton.disabled = false;
        signOutButton.textContent = 'Sign out';
        return;
      }
      localStorage.removeItem('danceguard_profile_created');
      localStorage.removeItem('danceguard_profile_data');
      window.location.href = '/';
    });
    const avatarPreview = document.getElementById('avatar-preview');
    const avatarUpload = document.getElementById('avatar-upload');
    let currentAvatar = '{{ profile.avatar or "" }}';

    function readSelectedDays() {
      return Array.from(document.querySelectorAll('.day-checkbox:checked')).map((input) => input.value);
    }

    function setAvatarPreview(dataUrl, fallbackLabel = 'D') {
      if (!dataUrl) {
        avatarPreview.innerHTML = fallbackLabel.charAt(0).toUpperCase();
        currentAvatar = '';
        return;
      }
      currentAvatar = dataUrl;
      avatarPreview.innerHTML = '<img src="' + dataUrl + '" alt="Profile photo">';
    }

    avatarUpload.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => setAvatarPreview(reader.result);
      reader.readAsDataURL(file);
    });

    document.getElementById('remove-photo').addEventListener('click', () => {
      setAvatarPreview('', '{{ (profile.name or "D")[:1]|upper }}');
      statusEl.textContent = 'Photo removed from the preview.';
    });

    document.getElementById('take-photo').addEventListener('click', () => {
      statusEl.textContent = 'Photo capture is available from the profile page.';
    });

    const calendarGrid = document.getElementById('calendar-grid');
    const calendarTitle = document.getElementById('calendar-title');
    const monthTotalHours = document.getElementById('month-total-hours');
    const monthDayCount = document.getElementById('month-day-count');
    const monthAverageHours = document.getElementById('month-average-hours');
    let calendarDate = new Date();

    function readDanceLog() {
      const savedProfile = localStorage.getItem('danceguard_profile_data');
      if (!savedProfile) return [];
      try {
        return JSON.parse(savedProfile).dance_hours_log || [];
      } catch (error) {
        return [];
      }
    }

    function renderCalendar() {
      const danceLog = readDanceLog();
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startingDay = firstDay.getDay();
      const totalDays = lastDay.getDate();
      const monthName = calendarDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
      calendarTitle.textContent = monthName;

      const rows = [];
      ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach((day) => rows.push(`<div class="day-label">${day}</div>`));

      for (let i = 0; i < startingDay; i++) rows.push('<div class="day-cell empty"></div>');

      const monthMatches = {};
      danceLog.forEach((entry) => {
        if (!entry.date) return;
        const d = new Date(entry.date + 'T00:00:00');
        if (d.getFullYear() === year && d.getMonth() === month) {
          const key = d.getDate();
          monthMatches[key] = (monthMatches[key] || 0) + Number(entry.hours || 0);
        }
      });

      let totalHours = 0;
      let daysCount = 0;
      for (let day = 1; day <= totalDays; day++) {
        const value = monthMatches[day] || 0;
        const active = value > 0;
        totalHours += value;
        if (active) daysCount += 1;
        rows.push(`
          <div class="day-cell ${active ? 'has-hours' : ''}">
            <div class="day-number">${day}</div>
            ${active ? `<div class="day-hours">${value.toFixed(1)}h</div>` : '<div></div>'}
          </div>
        `);
      }

      while (rows.length % 7 !== 0) rows.push('<div class="day-cell empty"></div>');
      calendarGrid.innerHTML = rows.join('');
      monthTotalHours.textContent = `${totalHours.toFixed(1)}h`;
      monthDayCount.textContent = String(daysCount);
      monthAverageHours.textContent = `${(daysCount ? totalHours / daysCount : 0).toFixed(1)}h`;
    }

    document.getElementById('prev-month').addEventListener('click', () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1);
      renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1);
      renderCalendar();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        hours_per_week: document.getElementById('hours_per_week').value,
        dance_days: readSelectedDays(),
        style: document.getElementById('style').value,
        injuries: document.getElementById('injuries').value,
        avatar: currentAvatar
      };

      statusEl.textContent = 'Saving your settings...';

      try {
        const supabase = window.supabase.createClient(signOutButton.dataset.supabaseUrl, signOutButton.dataset.supabaseAnonKey);
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
        if (sessionError || !sessionData.session) throw new Error('Your session has expired. Please sign in again.');
        const response = await fetch('/api/profile', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${sessionData.session.access_token}`
          },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Unable to save settings.');
        localStorage.setItem('danceguard_profile_created', 'true');
        localStorage.setItem('danceguard_profile_data', JSON.stringify(data.profile || payload));
        statusEl.textContent = 'Settings saved successfully.';
      } catch (error) {
        statusEl.textContent = error.message || 'Unable to save settings.';
      }
    });

    renderCalendar();
  </script>
</body>
</html>
